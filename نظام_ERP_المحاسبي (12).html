<script>
/* ====== إعداد قاعدة البيانات السحابية Supabase ======
   حط هنا رابط المشروع و anon key من: Supabase > Project Settings > API
   (آمن تنشرهم في الصفحة — الحماية الحقيقية في Row Level Security بقاعدة البيانات) */
const SUPABASE_URL='https://nrweijsniahksfyafnbg.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_tdtgkaHqO6rhC-eYnx1LXQ_PUCMQJsS';

let _supa=null, _supaUser=null, _supaProfile=null;
function supaReady(){return !!(SUPABASE_URL&&SUPABASE_URL.indexOf('http')===0&&SUPABASE_ANON_KEY&&SUPABASE_ANON_KEY.length>20&&window.supabase);}
function initSupa(){if(supaReady()&&!_supa){_supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);window._supa=_supa;}return _supa;}
function currentUser(){if(!_supaUser)return null;return {id:_supaUser.id,username:_supaUser.email,name:(_supaProfile&&_supaProfile.full_name)||_supaUser.email,role:(_supaProfile&&_supaProfile.role)||'company'};}
async function loadProfile(){if(!_supaUser)return null;try{const {data}=await window._supa.from('profiles').select('role,full_name').eq('id',_supaUser.id).maybeSingle();_supaProfile=data||{role:'company'};}catch(e){_supaProfile={role:'company'};}return _supaProfile;}
async function supaLogin(email,password){const {data,error}=await window._supa.auth.signInWithPassword({email,password});if(error)throw error;_supaUser=data.user;}
async function supaRegister(email,password,companyName){
  const su=await window._supa.auth.signUp({email,password,options:{data:{full_name:companyName}}});
  if(su.error)throw su.error;
  if(su.data&&su.data.session){_supaUser=su.data.session.user;}
  else{const si=await window._supa.auth.signInWithPassword({email,password});if(si.error)throw new Error('تم إنشاء الحساب — فعّل الإيميل من بريدك ثم سجّل الدخول (أو عطّل تأكيد الإيميل من إعدادات Supabase)');_supaUser=si.data.user;}
  const id=newCompanyId();
  seed();DB.org=companyName;
  const {error}=await window._supa.from('companies').insert({id,name:companyName,currency:DB.currency,data:DB});
  if(error)throw error;
  setActiveCompany(id);
  try{localStorage.setItem(LOCAL_PREFIX+id,JSON.stringify(DB));}catch(e){}
  setCompanies([{id,name:companyName,currency:DB.currency,created:Date.now()}]);
}
async function doLogout(){if(!confirm('تسجيل الخروج؟'))return;try{await window._supa.auth.signOut();}catch(e){}_supaUser=null;_supaProfile=null;location.reload();}
function showConfigNeeded(){const w=document.createElement('div');w.style.cssText='position:fixed;inset:0;z-index:99999;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Cairo,sans-serif;text-align:center';w.innerHTML='<div style="max-width:520px"><div style="font-size:42px">⚙️</div><h2 style="margin:14px 0;color:#d4af37">محتاج تضبط مفاتيح قاعدة البيانات</h2><p style="line-height:1.9;font-size:14px;opacity:.92">افتح الملف بأي محرر، وفي أول الكود حط رابط مشروع Supabase و anon key مكان <code style="background:#1e293b;padding:3px 8px;border-radius:6px">PUT_YOUR_SUPABASE_URL</code> و <code style="background:#1e293b;padding:3px 8px;border-radius:6px">PUT_YOUR_ANON_KEY</code>.<br><br>الشرح خطوة بخطوة في ملف «دليل_الإعداد.html».</p></div>';document.body.appendChild(w);}
function showAuthGate(opts){opts=opts||{};return new Promise(resolve=>{
  const wrap=document.createElement('div');wrap.id='authGate';
  wrap.style.cssText='position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#1e3a8a,#2563eb);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Cairo,sans-serif';
  let mode='login';
  function render(){
    const canReg=opts.canRegister!==false;
    wrap.innerHTML='<div style="background:#fff;border-radius:18px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden">'
      +'<div style="background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:26px 24px;text-align:center"><div style="font-size:34px">🏛️</div><div style="font-size:19px;font-weight:800;margin-top:6px">'+((opts.title)||'الدخول للنظام')+'</div><div style="font-size:12px;opacity:.85;margin-top:4px">نظام ERP المحاسبي — قاعدة بيانات سحابية</div></div>'
      +'<div style="display:flex;border-bottom:1px solid #e2e8f0"><button id="tabLogin" style="flex:1;padding:14px;border:none;background:'+(mode==='login'?'#fff':'#f1f5f9')+';font-weight:800;color:'+(mode==='login'?'#2563eb':'#64748b')+';cursor:pointer;font-family:Cairo">دخول</button>'+(canReg?'<button id="tabReg" style="flex:1;padding:14px;border:none;background:'+(mode==='reg'?'#fff':'#f1f5f9')+';font-weight:800;color:'+(mode==='reg'?'#2563eb':'#64748b')+';cursor:pointer;font-family:Cairo">تسجيل شركة جديدة</button>':'')+'</div>'
      +'<div style="padding:22px 24px">'+(mode==='reg'?'<div style="margin-bottom:12px"><label style="display:block;font-size:12.5px;font-weight:700;color:#64748b;margin-bottom:6px">اسم الشركة</label><input id="agName" style="width:100%;height:42px;padding:0 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-family:Cairo" placeholder="شركتي"></div>':'')
      +'<div style="margin-bottom:12px"><label style="display:block;font-size:12.5px;font-weight:700;color:#64748b;margin-bottom:6px">البريد الإلكتروني</label><input id="agEmail" type="email" style="width:100%;height:42px;padding:0 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-family:Cairo;direction:ltr;text-align:left" placeholder="you@email.com"></div>'
      +'<div style="margin-bottom:16px"><label style="display:block;font-size:12.5px;font-weight:700;color:#64748b;margin-bottom:6px">كلمة المرور</label><input id="agPass" type="password" style="width:100%;height:42px;padding:0 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-family:Cairo;direction:ltr;text-align:left" placeholder="********"></div>'
      +'<button id="agGo" style="width:100%;height:46px;border:none;border-radius:11px;background:linear-gradient(135deg,#d4af37,#b8941f);color:#1e293b;font-weight:800;font-size:15px;cursor:pointer;font-family:Cairo">'+(mode==='reg'?'إنشاء الحساب والدخول':'دخول')+'</button>'
      +'<div id="agErr" style="color:#dc2626;font-size:12.5px;font-weight:700;margin-top:12px;text-align:center;min-height:16px"></div></div></div>';
    const lg=wrap.querySelector('#tabLogin');if(lg)lg.onclick=function(){mode='login';render();};
    const rg=wrap.querySelector('#tabReg');if(rg)rg.onclick=function(){mode='reg';render();};
    wrap.querySelector('#agGo').onclick=submit;
    ['#agEmail','#agPass'].forEach(function(s){const i=wrap.querySelector(s);if(i)i.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});});
  }
  async function submit(){
    const err=wrap.querySelector('#agErr');err.textContent='';
    const email=(wrap.querySelector('#agEmail').value||'').trim();
    const pass=(wrap.querySelector('#agPass').value||'').trim();
    if(!email||!pass){err.textContent='أدخل البريد وكلمة المرور';return;}
    const btn=wrap.querySelector('#agGo');btn.disabled=true;const old=btn.textContent;btn.textContent='جارٍ...';
    try{
      if(mode==='reg'){const name=(wrap.querySelector('#agName').value||'').trim()||'شركتي';await supaRegister(email,pass,name);}
      else{await supaLogin(email,pass);}
      await loadProfile();
      if(opts.ownerOnly&&(!_supaProfile||_supaProfile.role!=='owner')){await window._supa.auth.signOut();_supaUser=null;_supaProfile=null;throw new Error('هذا الحساب ليس حساب المالك');}
      wrap.remove();resolve();
    }catch(e){err.textContent=(e&&e.message)||'فشل العملية';btn.disabled=false;btn.textContent=old;}
  }
  render();document.body.appendChild(wrap);
});}
</script>

<style>
:root{
  --blue:#1e3a8a; --blue2:#2563eb; --blue3:#3b82f6;
  --gold:#d4af37; --gold2:#b8941f;
  --bg:#f1f5f9; --card:#ffffff; --text:#1e293b; --muted:#64748b;
  --border:#e2e8f0; --head:#1e3a8a;
  --green:#16a34a; --red:#dc2626; --yellow:#ca8a04;
  --shadow:0 4px 16px rgba(30,58,138,.08);
}
[data-theme="dark"]{
  --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
  --border:#334155; --head:#0f1f44; --shadow:0 4px 20px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{width:250px;background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff;position:fixed;top:0;bottom:0;right:0;display:flex;flex-direction:column;z-index:50;transition:.3s}
.brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px}
.brand .logo{width:42px;height:42px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#1e293b}
.brand h1{font-size:17px;font-weight:800}
.brand span{font-size:11px;opacity:.8;display:block;font-weight:400}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav button{width:100%;text-align:right;background:transparent;border:none;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:11px;margin-bottom:3px;font-weight:600;transition:.2s}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button.active{background:#fff;color:var(--blue)}
.nav button.active .ic{filter:none}
.nav .ic{font-size:18px;width:22px;text-align:center}
.sb-foot{padding:14px;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:8px}
.sb-foot button{flex:1;background:rgba(255,255,255,.14);border:none;color:#fff;padding:9px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600}
.sb-foot button:hover{background:rgba(255,255,255,.26)}
/* Main */
.main{flex:1;margin-right:250px;padding:0;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--card);padding:16px 26px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar h2{font-size:20px;color:var(--blue);font-weight:800}
.topbar .sub{font-size:12px;color:var(--muted);font-weight:400}
.menu-toggle{display:none;background:var(--blue);color:#fff;border:none;width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.content{padding:24px 26px;flex:1}
.page{display:none;animation:fade .3s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Cards */
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin-bottom:20px;border:1px solid var(--border)}
.card-title{font-size:16px;font-weight:800;color:var(--blue);margin-bottom:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card-title .ic{font-size:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
.stat{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;right:0;width:5px;height:100%;background:var(--blue2)}
.stat.g::before{background:var(--gold)}.stat.gr::before{background:var(--green)}.stat.rd::before{background:var(--red)}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
.stat .val{font-size:24px;font-weight:800;color:var(--text)}
.stat .ic{position:absolute;left:16px;top:16px;font-size:30px;opacity:.15}
</style>
<style>
/* Buttons */
.btn{background:var(--blue2);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.2s}
.btn:hover{background:var(--blue);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1e293b}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--blue2);border:1.5px solid var(--blue2)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:7px 10px;border-radius:8px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar .spacer{flex:1}
/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;height:40px;padding:0 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;background:var(--card);color:var(--text);transition:.2s}
textarea{height:auto;padding:10px 12px;min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
/* Tables */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
thead th{background:var(--head);color:#fff;padding:12px 10px;text-align:right;font-weight:700;font-size:12.5px;white-space:nowrap;position:sticky;top:0}
tbody td{padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:rgba(37,99,235,.04)}
tfoot td{padding:12px 10px;font-weight:800;background:rgba(37,99,235,.06);border-top:2px solid var(--blue2)}
.num{font-variant-numeric:tabular-nums;font-weight:600;direction:ltr;text-align:right}
th.num,thead th.num{text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.badge.blue{background:rgba(37,99,235,.12);color:var(--blue2)}
.badge.green{background:rgba(22,163,74,.12);color:var(--green)}
.badge.gold{background:rgba(212,175,55,.18);color:var(--gold2)}
.badge.red{background:rgba(220,38,38,.12);color:var(--red)}
.badge.gray{background:var(--border);color:var(--muted)}
.badge.auto{background:rgba(124,58,237,.12);color:#7c3aed;border:1px solid rgba(124,58,237,.35)}
.auto-row{background:rgba(124,58,237,.035)}
.auto-row:hover{background:rgba(124,58,237,.07)}
.empty{text-align:center;padding:40px;color:var(--muted);font-weight:600}
.empty .ic{font-size:44px;display:block;margin-bottom:10px;opacity:.4}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 16px;overflow-y:auto}
.modal.open{display:flex}
.modal-box{background:var(--card);border-radius:18px;width:100%;max-width:860px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .25s}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:17px;color:var(--blue);font-weight:800}
.modal-head .x{background:var(--border);border:none;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:18px;color:var(--text)}
.modal-body{padding:22px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
/* Tree */
.tree-node{margin:2px 0}
.tree-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;cursor:default;transition:.15s}
.tree-row:hover{background:rgba(37,99,235,.05)}
.tree-toggle{width:22px;height:22px;border:none;background:var(--border);border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rep-toggle{width:20px;height:20px;border:none;background:var(--blue2);color:#fff;border-radius:5px;cursor:pointer;font-size:12px;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;margin-left:7px;vertical-align:middle}
.rep-toggle:hover{background:var(--blue)}
.rep-sp{display:inline-block;width:20px;margin-left:7px;vertical-align:middle}
.tree-toggle.leaf{visibility:hidden}
.tree-code{font-family:monospace;font-weight:700;color:var(--blue2);direction:ltr;min-width:70px}
.tree-name{font-weight:700;flex:1}
.tree-l1>.tree-row{background:rgba(30,58,138,.07);font-size:15px}
.tree-l2>.tree-row{margin-right:26px}
.tree-l3>.tree-row{margin-right:52px;font-size:13px}
.tree-l3 .tree-name{font-weight:500}
.tree-l4>.tree-row{margin-right:78px;font-size:12.5px}
.tree-l4 .tree-name{font-weight:500}
.tree-children{overflow:hidden}
.tree-bal{font-family:monospace;direction:ltr;color:var(--muted);font-size:12.5px;margin-left:8px}
.tree-acts{display:flex;gap:5px;opacity:0;transition:.15s}
.tree-row:hover .tree-acts{opacity:1}
.mini{width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.mini.e{background:rgba(37,99,235,.12);color:var(--blue2)}.mini.d{background:rgba(220,38,38,.12);color:var(--red)}.mini.a{background:rgba(22,163,74,.12);color:var(--green)}.mini.v{background:rgba(124,58,237,.12);color:#7c3aed}
/* Entry lines */
.lines-tbl input,.lines-tbl select{height:36px;border-radius:7px;font-size:12.5px}
.lines-tbl td{padding:5px}
.sel-wrap{position:relative}
.sel-search{position:absolute;top:38px;right:0;left:0;background:var(--card);border:1.5px solid var(--blue2);border-radius:9px;max-height:220px;overflow-y:auto;z-index:20;box-shadow:var(--shadow);display:none}
.sel-search.open{display:block}
.sel-opt{padding:9px 12px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--border)}
.sel-opt:hover{background:rgba(37,99,235,.08)}
.sel-opt .c{font-family:monospace;color:var(--blue2);font-weight:700;margin-left:8px}
.diff-ok{color:var(--green);font-weight:800}.diff-bad{color:var(--red);font-weight:800}
.rep-head{text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid var(--gold)}
.rep-head h3{font-size:20px;color:var(--blue);font-weight:800}
.rep-head p{color:var(--muted);font-size:13px;margin-top:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--blue);color:#fff;padding:13px 26px;border-radius:12px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:200;transition:.3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
.cloud-chip{font-size:11.5px;font-weight:800;padding:6px 11px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;border:1.5px solid transparent}
.cloud-chip.off{background:var(--border);color:var(--muted)}
.cloud-chip.on{background:rgba(22,163,74,.12);color:var(--green);border-color:rgba(22,163,74,.35)}
.cloud-chip.sync{background:rgba(37,99,235,.12);color:var(--blue2);border-color:rgba(37,99,235,.35)}
.cloud-chip.err{background:rgba(220,38,38,.12);color:var(--red);border-color:rgba(220,38,38,.35)}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#companySwitch{width:auto;min-width:130px;height:36px;font-size:12.5px;font-weight:800;border-radius:10px;border-color:var(--blue2);color:var(--blue);cursor:pointer}
.code-box{width:100%;font-family:monospace;font-size:11.5px;word-break:break-all;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:10px;color:var(--text);min-height:44px}
@media(max-width:900px){.topbar-right #orgName{display:none}.cloud-chip span.ct{display:none}}

<script>
/* ============ الحالة والتخزين ============ */
const SKEY='erp_acc_v1';
let DB={org:'شركتي',currency:'ج.م',accounts:[],entries:[],seq:1};

function save(){
  try{
    const id=activeCompanyId();
    if(id)localStorage.setItem(LOCAL_PREFIX+id,JSON.stringify(DB));
    localStorage.setItem(SKEY,JSON.stringify(DB)); // مرآة للتوافق
    touchCompanyMeta(id);
    markDirty();
    scheduleCloudPush();
    return true;
  }
  catch(err){
    toast('تعذّر الحفظ: مساحة التخزين في المتصفح ممتلئة. صغّر حجم المرفقات أو احذف مرفقات قديمة ثم أعد المحاولة','err');
    return false;
  }
}

/* ============================================================
   حسابات/شركات متعددة (multi-company) + مزامنة سحابية تلقائية
   - كل شركة لها بياناتها المستقلة في مفتاح localStorage خاص بها.
   - لوحة التحكم ملف مستقل، والربط بين الملفين عبر السحابة (نفس الـ bin).
   - المزامنة تلقائية: سحب عند الفتح + رفع تلقائي بعد كل تعديل.
   - البيانات القديمة لا تتأثر: تُرحَّل تلقائياً لأول شركة، ونُبقي مرآة محلية دائماً.
   ============================================================ */
const REG_KEY='erp_companies_v1', ACTIVE_KEY='erp_active_company', LOCAL_PREFIX='erp_company_';
const CLOUD_CFG_KEY='erp_cloud_cfg', DIRTY_KEY='erp_local_dirty', CLOUD_UPD_KEY='erp_cloud_updated';
let _cloudState='off', URL_C=null;

function getCompanies(){try{return JSON.parse(localStorage.getItem(REG_KEY)||'[]');}catch(e){return [];}}
function setCompanies(list){localStorage.setItem(REG_KEY,JSON.stringify(list||[]));}
function newCompanyId(){return 'co'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function activeCompanyId(){
  let s=localStorage.getItem(ACTIVE_KEY);
  if(!s){const list=getCompanies();s=list[0]?list[0].id:null;if(s)localStorage.setItem(ACTIVE_KEY,s);}
  return s;
}
function setActiveCompany(id){if(id)localStorage.setItem(ACTIVE_KEY,id);}
function touchCompanyMeta(id){const list=getCompanies();const c=list.find(x=>x.id===id);if(c){c.name=DB.org||c.name;c.currency=DB.currency;setCompanies(list);}}
function ensureRegistry(skip){
  let list=getCompanies();
  if(list.length)return;
  if(skip)return; // السحابة ستملأ السجل لاحقاً
  const legacy=localStorage.getItem(SKEY);const id=newCompanyId();
  if(legacy){try{const d=JSON.parse(legacy);list=[{id,name:(d.org||'الشركة الرئيسية'),currency:d.currency||'ج.م',created:Date.now()}];localStorage.setItem(LOCAL_PREFIX+id,legacy);}catch(e){list=[{id,name:'الشركة الرئيسية',currency:'ج.م',created:Date.now()}];}}
  else list=[{id,name:'الشركة الرئيسية',currency:'ج.م',created:Date.now()}];
  setCompanies(list);setActiveCompany(id);
}

/* ---- التقاط كود الربط ومعرّف الشركة من الرابط (قادم من لوحة التحكم) ---- */
(function adoptFromURL(){
  try{
    const hay=location.hash+'&'+location.search;
    const cm=hay.match(/code=([^&#]+)/); if(cm){const cfg=decodeCode(decodeURIComponent(cm[1]));if(cfg&&cfg.key&&cfg.binId)setCloudCfg(cfg);}
    const am=hay.match(/[?&#]c=([^&#]+)/); if(am){URL_C=decodeURIComponent(am[1]);setActiveCompany(URL_C);}
  }catch(e){}
})();

/* ---- إعدادات السحابة (تُحفظ على الجهاز فقط) ---- */
function cloudCfg(){try{return JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)||'null');}catch(e){return null;}}
function setCloudCfg(c){if(c)localStorage.setItem(CLOUD_CFG_KEY,JSON.stringify(c));else localStorage.removeItem(CLOUD_CFG_KEY);}
function cloudOn(){return !!(window._supa && _supaUser);}
function encodeCode(cfg){return btoa(unescape(encodeURIComponent(JSON.stringify(cfg))));}
function decodeCode(code){try{return JSON.parse(decodeURIComponent(escape(atob(code))));}catch(e){return null;}}
const JB='https://api.jsonbin.io/v3/b';
async function jbCreate(key,doc){const r=await fetch(JB,{method:'POST',headers:{'Content-Type':'application/json','X-Master-Key':key,'X-Bin-Private':'true','X-Bin-Name':'erp_cloud_data'},body:JSON.stringify(doc)});if(!r.ok)throw new Error('إنشاء السحابة فشل ('+r.status+')');const j=await r.json();return (j.metadata&&j.metadata.id)||j.id;}
async function jbRead(key,binId){const r=await fetch(JB+'/'+binId+'/latest',{headers:{'X-Master-Key':key,'X-Bin-Meta':'false'}});if(!r.ok)throw new Error('قراءة السحابة فشلت ('+r.status+')');return await r.json();}
async function jbWrite(key,binId,doc){const r=await fetch(JB+'/'+binId,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':key},body:JSON.stringify(doc)});if(!r.ok)throw new Error('رفع السحابة فشل ('+r.status+')');return true;}

function markDirty(){localStorage.setItem(DIRTY_KEY,String(Date.now()));}
function clearDirty(){localStorage.removeItem(DIRTY_KEY);}
function buildLocalDoc(){const list=getCompanies();const data={};list.forEach(c=>{const raw=localStorage.getItem(LOCAL_PREFIX+c.id);if(raw){try{data[c.id]=JSON.parse(raw);}catch(e){}}});const id=activeCompanyId();if(id)data[id]=DB;return {v:2,updatedAt:Date.now(),companies:list,data};}

let _pushTimer=null;
function scheduleCloudPush(){if(!cloudOn())return;setCloudStatus('saving');clearTimeout(_pushTimer);_pushTimer=setTimeout(cloudPushActive,1400);}
async function cloudPushActive(){
  if(!cloudOn())return;const id=activeCompanyId();if(!id)return;
  try{
    const row={id,name:DB.org||'شركتي',currency:DB.currency||'ج.م',data:DB,updated_at:new Date().toISOString()};
    const {error}=await window._supa.from('companies').upsert(row,{onConflict:'id'});
    if(error)throw error;
    clearDirty();setCloudStatus('synced');
  }catch(e){setCloudStatus('error');}
}
async function cloudInitPull(){
  if(!cloudOn())return;
  try{
    setCloudStatus('saving');
    const {data,error}=await window._supa.from('companies').select('id,name,currency,data,updated_at').order('updated_at',{ascending:false});
    if(error)throw error;
    const list=(data||[]).map(r=>({id:r.id,name:r.name,currency:r.currency,created:Date.parse(r.updated_at)||Date.now()}));
    if(list.length)setCompanies(list);
    (data||[]).forEach(r=>{try{if(r.data&&Object.keys(r.data).length)localStorage.setItem(LOCAL_PREFIX+r.id,JSON.stringify(r.data));}catch(e){}});
    clearDirty();setCloudStatus('synced');
  }catch(e){setCloudStatus('error');}
}
function setCloudStatus(st){_cloudState=st;const chip=document.getElementById('cloudChip');if(!chip)return;const map={off:['off','غير متصل'],synced:['on','متزامن'],saving:['sync','يحفظ...'],error:['err','خطأ مزامنة']};const m=map[st]||map.off;chip.className='cloud-chip '+m[0];chip.innerHTML='\u2601\ufe0f <span class="ct">'+m[1]+'</span>';}
function periodicPull(){const modalOpen=document.getElementById('modal').classList.contains('open');if(cloudOn()&&document.visibilityState==='visible'&&!modalOpen&&!localStorage.getItem(DIRTY_KEY)){cloudInitPull().then(()=>{renderCompanySwitch();const id=activeCompanyId();const raw=localStorage.getItem(LOCAL_PREFIX+id);if(raw){try{DB=JSON.parse(raw);}catch(e){}}document.getElementById('orgName').textContent=DB.org;if(['dashboard','trial','balance','income','ledger'].includes(CUR))render();});}}

/* ---- التبديل بين الشركات داخل النظام ---- */
function renderCompanySwitch(){const sel=document.getElementById('companySwitch');if(!sel)return;const list=getCompanies();const act=activeCompanyId();sel.innerHTML=list.map(c=>`<option value="${c.id}" ${c.id===act?'selected':''}>${esc(c.name)}</option>`).join('');}
function switchCompany(id){if(!id||id===activeCompanyId())return;setActiveCompany(id);load();document.getElementById('orgName').textContent=DB.org;renderCompanySwitch();go('dashboard');toast('تم فتح: '+DB.org,'ok');}
function openDashboard(ev){if(ev){ev.preventDefault();location.href='لوحة_التحكم.html';return false;}return true;}

/* ---- إعدادات السحابة في صفحة الإعدادات ---- */
function renderCloudBox(){
  const box=document.getElementById('cloudBox');if(!box)return;
  const cu=currentUser();
  if(cu){
    box.innerHTML=`<div style="padding:12px;border-radius:10px;background:rgba(22,163,74,.1);font-size:13px;font-weight:700;margin-bottom:14px">✅ متصل بقاعدة البيانات السحابية — المزامنة تلقائية<br><span style="color:var(--muted);font-weight:500">الحساب: ${esc(cu.name||cu.username)} · الصلاحية: ${cu.role==='owner'?'مالك':'شركة'}</span></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="cloudInitPull().then(()=>{const id=activeCompanyId();const raw=localStorage.getItem(LOCAL_PREFIX+id);if(raw){try{DB=JSON.parse(raw);}catch(e){}}renderCompanySwitch();document.getElementById('orgName').textContent=DB.org;render();toast('تمت المزامنة','ok');})">🔁 مزامنة الآن</button>
      <button class="btn red" onclick="doLogout()">🚪 تسجيل الخروج</button>
    </div>`;
  }else{
    box.innerHTML=`<div style="padding:12px;border-radius:10px;background:rgba(220,38,38,.08);color:var(--red);font-size:13px;font-weight:600">غير متصل. اضبط مفاتيح Supabase في أول الكود ثم سجّل الدخول.</div>`;
  }
}
/* ===== تخزين المرفقات في IndexedDB (مساحة ضخمة) بدل localStorage المحدود =====
   سبب الامتلاء: الصور كانت تُحفظ كاملة داخل localStorage (حد ~5 ميجا).
   الحل: نخزّن بيانات المرفق في IndexedDB ونُبقي في localStorage مرجعًا فقط {name,type,ref}. */
let _attdb=null;
function attdb(){return new Promise((res,rej)=>{if(_attdb)return res(_attdb);const r=indexedDB.open('erp_att_db',1);r.onupgradeneeded=()=>{r.result.createObjectStore('att');};r.onsuccess=()=>{_attdb=r.result;res(_attdb);};r.onerror=()=>rej(r.error);});}
function attPut(key,val){return attdb().then(db=>new Promise((res,rej)=>{const t=db.transaction('att','readwrite');t.objectStore('att').put(val,key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function attGet(key){return attdb().then(db=>new Promise((res,rej)=>{const t=db.transaction('att','readonly');const g=t.objectStore('att').get(key);g.onsuccess=()=>res(g.result);g.onerror=()=>rej(g.error);}));}
function attDel(key){return attdb().then(db=>new Promise((res,rej)=>{const t=db.transaction('att','readwrite');t.objectStore('att').delete(key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function attKey(){return 'att_'+Date.now()+'_'+Math.floor(Math.random()*1e6);}
/* ترحيل المرفقات القديمة المخزّنة داخل localStorage إلى IndexedDB لتفريغ المساحة تلقائيًا */
async function migrateAttachments(){
  if(!DB.entries||!DB.entries.length)return;
  let moved=0;
  for(const e of DB.entries){
    if(e.attachment&&!e.attachments){e.attachments=[e.attachment];delete e.attachment;}
    const list=entryAttList(e);
    for(const a of list){
      if(a&&a.data&&!a.ref){
        const k=attKey();
        try{await attPut(k,a.data);a.ref=k;delete a.data;moved++;}catch(err){/* نُبقي البيانات كما هي عند الفشل */}
      }
    }
  }
  if(moved){save();render();}
}
function load(){
  const id=activeCompanyId();
  let raw=id?localStorage.getItem(LOCAL_PREFIX+id):null;
  let seeded=false;
  if(raw){try{DB=JSON.parse(raw);}catch(e){raw=null;}}
  if(!raw){seed();seeded=true;}
  if(!DB.accounts||!DB.accounts.length){seed();seeded=true;}
  if(seeded){const c=getCompanies().find(x=>x.id===id);if(c&&c.name)DB.org=c.name;if(id)localStorage.setItem(LOCAL_PREFIX+id,JSON.stringify(DB));}
  fixOrphans();
  ensureVoucherDefaults();
}
/* ====== إصلاح ذاتي: إعادة ربط الحسابات المنفصلة عن الشجرة ======
   مشكلة: لو حساب (أو سلسلة حسابات) parentId بتاعه بيشاور على حساب محذوف/غير موجود،
   بيبقى "يتيم" مش واصل لأي مجموعة رئيسية (مستوى 1)، فالتقارير الهرمية (المركز المالي/
   لوحة المعلومات/قائمة الدخل) بتعدّيه وتطلع صفر رغم إن رصيده موجود في ميزان المراجعة.
   الحل: نعيد ربطه بأبوه الصحيح حسب بادئة الكود، وإلا بالمجموعة الرئيسية حسب نوعه.
   التعديل على الربط فقط — مفيش أي مساس بالمبالغ أو القيود. */
function accReaches1(a,byId){let cur=a,g=0;while(cur&&g++<60){if(cur.level===1)return true;if(!cur.parentId)return false;cur=byId[cur.parentId];}return false;}
// استنتاج نوع الحساب من أول رقم في الكود (1=أصول،2=خصوم،3=حقوق ملكية،4=إيرادات،5=مصروفات)
function typeFromCode(code){const m={'1':'asset','2':'liability','3':'equity','4':'revenue','5':'expense'};return (code&&m[String(code)[0]])||null;}
function fixOrphans(){
  if(!DB.accounts||!DB.accounts.length)return;
  let changed=false;
  // 1) إصلاح النوع المفقود/غير الصحيح (يكسر التقارير وربط المجموعات)
  DB.accounts.forEach(a=>{if(!a.type||!TYPE_INFO[a.type]){const t=typeFromCode(a.code);if(t){a.type=t;changed=true;}}});
  // 2) المجموعة الرئيسية (مستوى 1) لكل نوع
  const groupByType={};
  DB.accounts.filter(a=>a.level===1).forEach(a=>{if(!groupByType[a.type])groupByType[a.type]=a;});
  const anyL1=DB.accounts.find(a=>a.level===1)||null;
  // 3) إعادة ربط الحسابات المنفصلة — لوب حتى الثبات
  for(let pass=0;pass<20;pass++){
    const byId={};DB.accounts.forEach(a=>byId[a.id]=a);
    let pc2=false;
    [...DB.accounts].sort((a,b)=>(a.level||9)-(b.level||9)).forEach(a=>{
      if(a.level===1)return;
      if(accReaches1(a,byId))return;
      let np=null;
      // أولاً: أب مطابق لبادئة الكود (يصل لمستوى 1)
      if(a.code&&a.code.length>2){const pc=a.code.slice(0,-2);const c=DB.accounts.find(x=>x.code===pc&&x.id!==a.id);if(c&&accReaches1(c,byId))np=c;}
      // ثانياً: المجموعة الرئيسية حسب النوع
      if(!np)np=groupByType[a.type];
      // ثالثاً: أي مجموعة رئيسية (ضمان عدم بقاء أي حساب يتيم)
      if(!np)np=anyL1;
      if(np&&np.id!==a.id){a.parentId=np.id;changed=true;pc2=true;}
    });
    if(!pc2)break;
  }
  if(changed)save();
}
/* ====== إعدادات سندات القبض والصرف: ضمان وجود الحقول ====== */
function ensureVoucherDefaults(){
  if(DB.rcptSeq==null)DB.rcptSeq=1;
  if(DB.paySeq==null)DB.paySeq=1;
  if(DB.defRcptAcc==null)DB.defRcptAcc='';
  if(DB.defPayAcc==null)DB.defPayAcc='';
}
let _id=Date.now();
function uid(){return 'a'+(_id++)+Math.floor(Math.random()*1000);}

/* ============ شجرة حسابات افتراضية 3 مستويات ============ */
function seed(){
  DB={org:'شركتي',currency:'ج.م',accounts:[],entries:[],seq:1,rcptSeq:1,paySeq:1,defRcptAcc:'',defPayAcc:''};
  // type: asset, liability, equity, revenue, expense ; nature يُشتق من النوع
  const data=[
    ['1','الأصول','asset',[
      ['11','الأصول المتداولة',[
        ['1101','الصندوق'],['1102','البنك'],['1103','العملاء (المدينون)'],['1104','المخزون'],['1105','أوراق قبض']
      ]],
      ['12','الأصول الثابتة',[
        ['1201','الأثاث والمعدات'],['1202','السيارات'],['1203','المباني'],['1204','أجهزة وحاسبات']
      ]]
    ]],
    ['2','الخصوم (الالتزامات)','liability',[
      ['21','الخصوم المتداولة',[
        ['2101','الموردون (الدائنون)'],['2102','أوراق دفع'],['2103','مصروفات مستحقة'],['2104','ضرائب مستحقة']
      ]],
      ['22','الخصوم طويلة الأجل',[
        ['2201','قروض بنكية طويلة الأجل']
      ]]
    ]],
    ['3','حقوق الملكية','equity',[
      ['31','رأس المال والأرباح',[
        ['3101','رأس المال'],['3102','جاري الشركاء'],['3103','أرباح مرحلة'],['3104','المسحوبات الشخصية']
      ]]
    ]],
    ['4','الإيرادات','revenue',[
      ['41','إيرادات النشاط',[
        ['4101','إيرادات المبيعات'],['4102','إيرادات خدمات']
      ]],
      ['42','إيرادات أخرى',[
        ['4201','إيرادات متنوعة']
      ]]
    ]],
    ['5','المصروفات','expense',[
      ['51','تكلفة المبيعات',[
        ['5101','تكلفة البضاعة المباعة']
      ]],
      ['52','المصروفات التشغيلية',[

/* ============ مساعدات ============ */
const TYPE_INFO={
  asset:{label:'أصول',nature:'debit'},
  liability:{label:'خصوم',nature:'credit'},
  equity:{label:'حقوق ملكية',nature:'credit'},
  revenue:{label:'إيرادات',nature:'credit'},
  expense:{label:'مصروفات',nature:'debit'}
};
const fmt=n=>{n=Number(n)||0;return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
const today=()=>new Date().toISOString().slice(0,10);
const acctById=id=>DB.accounts.find(a=>a.id===id);
const children=pid=>DB.accounts.filter(a=>a.parentId===pid).sort((a,b)=>a.code.localeCompare(b.code));
const isLeaf=id=>!DB.accounts.some(a=>a.parentId===id);
const leafAccounts=()=>DB.accounts.filter(a=>isLeaf(a.id)).sort((a,b)=>a.code.localeCompare(b.code));
function acctPath(id){let p=[],a=acctById(id);while(a){p.unshift(a.name);a=a.parentId?acctById(a.parentId):null;}return p.join(' ✺ ');}

/* حركة الحساب الورقية (leaf) */
function leafMovement(accId,from,to){
  let dr=0,cr=0,lines=[];
  DB.entries.forEach(e=>{
    if(from&&e.date<from)return;
    if(to&&e.date>to)return;
    e.lines.forEach(l=>{if(l.accountId===accId){dr+=(+l.debit||0);cr+=(+l.credit||0);lines.push({date:e.date,num:e.number,desc:l.desc||e.description,debit:+l.debit||0,credit:+l.credit||0,entryId:e.id});}});
  });
  return {debit:dr,credit:cr,lines};
}
/* رصيد حساب (مع تجميع الأبناء) */
function accBalance(accId,from,to){
  const m=leafMovement(accId,from,to); // حركة الحساب المباشرة (إن وجدت)
  let dr=m.debit,cr=m.credit;
  children(accId).forEach(c=>{const b=accBalance(c.id,from,to);dr+=b.debit;cr+=b.credit;});
  return {debit:dr,credit:cr,net:dr-cr};
}
/* الرصيد حسب طبيعة الحساب (موجب=طبيعي) */
function naturalBal(accId,from,to){
  const a=acctById(accId);const b=accBalance(accId,from,to);
  return TYPE_INFO[a.type].nature==='debit'?b.net:-b.net;
}
/* إجمالي المدين/الدائن لميزان المراجعة — مجموع أرصدة الحسابات التفصيلية كل على جانبه.
   للحساب الرئيسي = مجموع أرصدة كل الفروع تحته (المدين في عمود، والدائن في عمود) دون مقاصة
   بين الفروع — عشان الحساب الرئيسي يظهر إجمالي أرقام فروعه وما يطلعش صفر بسبب تعادل الفروع. */
function trialDrCr(accId,from,to){
  let dr=0,cr=0;
  const walk=id=>{
    const kids=children(id);
    if(!kids.length){const n=accBalance(id,from,to).net;if(n>0)dr+=n;else if(n<0)cr+=-n;}
    else kids.forEach(k=>walk(k.id));
  };
  walk(accId);
  return {dr,cr};
}
/* إجمالي أرصدة الفروع على الجانب الطبيعي لنوع الحساب (بدون مقاصة عكسية) —
   يُستخدم في شجرة الحسابات وقائمة الدخل والمركز المالي عشان الحساب الرئيسي يظهر إجمالي فروعه. */
function naturalGross(accId,from,to){
  const a=acctById(accId);const nat=TYPE_INFO[a.type].nature;
  const t=trialDrCr(accId,from,to);
  return nat==='debit'?t.dr:t.cr;
}

function renderTree(){
  const roots=DB.accounts.filter(a=>a.level===1).sort((a,b)=>a.code.localeCompare(b.code));
  if(!roots.length)return '<div class="empty"><span class="ic">🌳</span>لا توجد حسابات</div>';
  return roots.map(r=>treeNode(r)).join('');
}
function treeNode(a){
  const kids=children(a.id);
  const hasKids=kids.length>0;
  const open=treeOpen[a.id]!==false;
  const nb=naturalBal(a.id);
  // الحساب الرئيسي يظهر إجمالي أرصدة فروعه (مدين/دائن) دون مقاصة؛ التفصيلي يظهر رصيده
  let balText;
  if(hasKids){
    const t=trialDrCr(a.id);
    const parts=[];
    if(t.dr)parts.push(`مدين ${fmt(t.dr)}`);
    if(t.cr)parts.push(`دائن ${fmt(t.cr)}`);
    balText=parts.length?parts.join(' · '):fmt(0);
  }else{
    balText=`${fmt(Math.abs(nb))} ${nb<0?'(دائن)':''}`;
  }
  const canAdd=a.level<4;
  return `
  <div class="tree-node tree-l${a.level}">
    <div class="tree-row">
      <button class="tree-toggle ${hasKids?'':'leaf'}" onclick="toggleTree('${a.id}')">${open?'−':'+'}</button>
      <span class="tree-code">${esc(a.code)}</span>
      <span class="tree-name">${esc(a.name)}</span>
      ${a.level===1?`<span class="badge gold">${TYPE_INFO[a.type].label}</span>`:''}
      <span class="tree-bal">${balText}</span>
      <span class="tree-acts no-print">
        ${canAdd?`<button class="mini a" title="إضافة حساب فرعي" onclick="openAcctForm('${a.id}',${a.level+1})">➕</button>`:''}

        <button class="mini d" title="حذف" onclick="delAcct('${a.id}')">🗑</button>
      </span>
    </div>
    ${hasKids&&open?`<div class="tree-children">${kids.map(k=>treeNode(k)).join('')}</div>`:''}
  </div>`;
}

function suggestCode(parent,siblings,level){
  if(level===1){const used=DB.accounts.filter(a=>a.level===1).map(a=>+a.code);let n=1;while(used.includes(n))n++;return ''+n;}
  const base=parent.code;const nums=siblings.map(s=>s.code);let i=1;while(nums.includes(base+String(i).padStart(2,'0')))i++;return base+String(i).padStart(2,'0');
}

/* ضغط الصور قبل التخزين: تصغير الأبعاد وتحويلها JPEG مضغوط حتى لا تمتلئ مساحة المتصفح */
function compressImage(file,maxDim,quality,cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){const s=Math.min(maxDim/w,maxDim/h);w=Math.round(w*s);h=Math.round(h*s);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);
      try{cb(cv.toDataURL('image/jpeg',quality),null);}catch(e){cb(null,e);}
    };
    img.onerror=e=>cb(null,e);
    img.src=r.result;
  };
  r.onerror=e=>cb(null,e);
  r.readAsDataURL(file);
}
function pickAtt(inp){
  const files=[...inp.files];if(!files.length)return;
  let pending=files.length;
  const done=()=>{pending--;if(!pending)refreshAttInfo();};
  files.forEach(f=>{
    if(f.type&&f.type.indexOf('image')===0){
      // الصور: نضغطها بدل تخزينها بالحجم الأصلي
      compressImage(f,1600,0.7,(dataUrl,err)=>{
        if(err||!dataUrl){toast('تعذّر قراءة الصورة «'+f.name+'»','err');done();return;}
        entryAtts.push({name:f.name,type:'image/jpeg',data:dataUrl});done();
      });
    }else{
      if(f.size>3*1024*1024){toast('تجاوز الملف «'+f.name+'» الحد (3 ميجا)','err');done();return;}
      const r=new FileReader();
      r.onload=()=>{entryAtts.push({name:f.name,type:f.type,data:r.result});done();};
      r.onerror=()=>{toast('تعذّر قراءة «'+f.name+'»','err');done();};
      r.readAsDataURL(f);
    }
  });
  inp.value='';
}
async function saveEntry(){
  const num=document.getElementById('eNum').value.trim();
  const date=document.getElementById('eDate').value;
  const desc=document.getElementById('eDesc').value.trim();
  if(!date){toast('الرجاء تحديد التاريخ','err');return;}
  if(!desc){toast('الرجاء إدخال البيان','err');return;}
  const lines=entryLines.filter(l=>l.accountId&&((+l.debit||0)!==0||(+l.credit||0)!==0));
  if(lines.length<2){toast('القيد يحتاج سطرين على الأقل بحساب ومبلغ','err');return;}
  const dr=lines.reduce((s,l)=>s+(+l.debit||0),0),cr=lines.reduce((s,l)=>s+(+l.credit||0),0);
  if(Math.round((dr-cr)*100)/100!==0){toast('القيد غير متوازن (مدين ≠ دائن)','err');return;}
  const clean=lines.map(l=>({accountId:l.accountId,debit:+l.debit||0,credit:+l.credit||0,desc:l.desc||''}));
  // جهّز المرفقات: اكتب الجديدة (التي تحمل data) إلى IndexedDB واحتفظ بالمرجع فقط
  let atts;
  try{
    atts=[];
    for(const a of entryAtts){
      if(a.ref&&!a.data){atts.push({name:a.name,type:a.type,ref:a.ref});}
      else if(a.data){const k=attKey();await attPut(k,a.data);atts.push({name:a.name,type:a.type,ref:k});a.ref=k;delete a.data;}
    }
  }catch(err){toast('تعذّر حفظ المرفقات','err');return;}
  // نظّف مرفقات القيد القديمة التي أُزيلت من IndexedDB
  if(editingEntry){
    const oldE=DB.entries.find(x=>x.id===editingEntry);
    const keep=new Set(atts.map(a=>a.ref));
    entryAttList(oldE).forEach(a=>{if(a.ref&&!keep.has(a.ref))attDel(a.ref).catch(()=>{});});
  }
  let snapshot=null,newId=null;
  if(editingEntry){
    const e=DB.entries.find(x=>x.id===editingEntry);
    snapshot=JSON.parse(JSON.stringify(e));
    e.number=num;e.date=date;e.description=desc;e.lines=clean;e.attachments=atts;delete e.attachment;
  }else{
    newId=uid();
    DB.entries.push({id:newId,number:num,date,description:desc,lines:clean,attachments:atts});
    if(!isNaN(+num)&&+num>=DB.seq)DB.seq=+num+1;
  }
  if(!save()){
    // فشل الحفظ (المساحة ممتلئة): نتراجع عن التغيير ونُبقي النافذة مفتوحة
    if(editingEntry&&snapshot){const e=DB.entries.find(x=>x.id===editingEntry);if(e)Object.assign(e,snapshot);}
    else if(newId){DB.entries=DB.entries.filter(x=>x.id!==newId);}
    return;
  }
  const printId=editingEntry||newId;
  closeModal();render();toast('تم حفظ القيد','ok');
  if(printId)printEntry(printId); // طباعة القيد تلقائياً بعد الحفظ
}

async function persistAtts(src){
  const out=[];
  for(const a of src){
    if(a.ref&&!a.data){out.push({name:a.name,type:a.type,ref:a.ref});}
    else if(a.data){const k=attKey();await attPut(k,a.data);out.push({name:a.name,type:a.type,ref:k});}
  }
  return out;
}
async function saveVoucher(){
  const no=document.getElementById('vNo').value.trim();
  const date=document.getElementById('vDate').value;
  const cash=vCashId;
  const party=document.getElementById('vParty').value.trim();
  const note=document.getElementById('vDesc').value.trim();
  const oLines=vOtherLines.map(l=>({accId:l.accId,amount:Math.round((+l.amount||0)*100)/100})).filter(l=>l.accId&&l.amount>0);
  const amount=Math.round(oLines.reduce((s,l)=>s+l.amount,0)*100)/100;
  if(!date){toast('الرجاء تحديد التاريخ','err');return;}
  if(!cash){toast('اختر حساب القبض/الصرف','err');return;}
  if(!oLines.length){toast('أضف حساباً مقابلاً واحداً على الأقل بمبلغ أكبر من صفر','err');return;}
  if(oLines.some(l=>l.accId===cash)){toast('لا يمكن أن يكون الحساب المقابل نفس حساب القبض/الصرف','err');return;}
  const _dup=new Set();for(const l of oLines){if(_dup.has(l.accId)){toast('يوجد حساب مقابل مكرر — ادمجه في سطر واحد','err');return;}_dup.add(l.accId);}
  if(amount<=0){toast('الرجاء إدخال مبلغ صحيح أكبر من صفر','err');return;}
  const isR=vType==='receipt';
  const desc=note||((isR?'سند قبض':'سند صرف')+(party?' - '+party:''));
  const ld=note||'';
  const cashLine=isR?{accountId:cash,debit:amount,credit:0,desc:ld}:{accountId:cash,debit:0,credit:amount,desc:ld};
  const otherJE=oLines.map(l=>isR?{accountId:l.accId,debit:0,credit:l.amount,desc:ld}:{accountId:l.accId,debit:l.amount,credit:0,desc:ld});
  const lines=isR?[cashLine,...otherJE]:[...otherJE,cashLine];
  let atts;
  try{atts=await persistAtts(entryAtts);}catch(err){toast('تعذّر حفظ المرفقات','err');return;}
  const voucher={type:vType,party,cashAccId:cash,otherAccId:oLines[0].accId,otherLines:oLines,note};
  let snapshot=null,newId=null;
  if(editingVoucher){
    const e=DB.entries.find(x=>x.id===editingVoucher);
    const keep=new Set(atts.map(a=>a.ref));
    entryAttList(e).forEach(a=>{if(a.ref&&!keep.has(a.ref))attDel(a.ref).catch(()=>{});});
    snapshot=JSON.parse(JSON.stringify(e));
    e.number=no;e.date=date;e.description=desc;e.lines=lines;e.attachments=atts;e.voucher=voucher;delete e.attachment;
  }else{
    newId=uid();
    DB.entries.push({id:newId,number:no,date,description:desc,lines,attachments:atts,voucher});
    if(isR)DB.rcptSeq=(DB.rcptSeq||1)+1;else DB.paySeq=(DB.paySeq||1)+1;
  }
  if(!save()){
    if(editingVoucher&&snapshot){const e=DB.entries.find(x=>x.id===editingVoucher);if(e)Object.assign(e,snapshot);}
    else if(newId){DB.entries=DB.entries.filter(x=>x.id!==newId);}
    return;
  }
  closeModal();render();toast('تم حفظ السند','ok');
}
function delVoucher(id){if(!confirm('حذف السند؟'))return;const e=DB.entries.find(x=>x.id===id);if(e)entryAttList(e).forEach(a=>{if(a.ref)attDel(a.ref).catch(()=>{});});DB.entries=DB.entries.filter(x=>x.id!==id);save();render();toast('تم الحذف','ok');}

/* تفقيط المبلغ بالحروف (الجزء الصحيح) */
function tafqeet(num){
  num=Math.floor(Math.abs(+num||0));
  if(num===0)return 'صفر';
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hund=['','مائة','مئتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const sc=[['',''],['ألف','آلاف'],['مليون','ملايين'],['مليار','مليارات']];
  function b3(n){let r=[];const h=Math.floor(n/100);n=n%100;if(h)r.push(hund[h]);if(n<20){if(n)r.push(ones[n]);}else{const t=Math.floor(n/10),o=n%10;if(o)r.push(ones[o]);r.push(tens[t]);}return r.filter(Boolean).join(' و');}
  let parts=[],i=0;
  while(num>0){
    const chunk=num%1000;num=Math.floor(num/1000);
    if(chunk){
      let txt;
      if(i===0)txt=b3(chunk);
      else if(chunk===1)txt=sc[i][0];
      else if(chunk===2)txt=sc[i][0]+'ان';
      else if(chunk>=3&&chunk<=10)txt=b3(chunk)+' '+sc[i][1];
      else txt=b3(chunk)+' '+sc[i][0];
      parts.unshift(txt);
    }
    i++;
  }
  return parts.join(' و');
}

function collectRows(accId,from,to){
  const leaf=isLeaf(accId);
  const ids=leaf?[accId]:DB.accounts.filter(x=>isLeaf(x.id)&&descendantOf(x.id,accId)).map(x=>x.id);
  let rows=[];
  DB.entries.forEach(e=>{if(from&&e.date<from)return;if(to&&e.date>to)return;e.lines.forEach(l=>{if(ids.includes(l.accountId))rows.push({date:e.date,num:e.number,desc:l.desc||e.description,debit:+l.debit||0,credit:+l.credit||0});});});
  return rows.sort((x,y)=>x.date.localeCompare(y.date)||x.num-y.num);
}
function openingBal(accId,before){
  if(!before)return 0;
  const leaf=isLeaf(accId);
  const ids=leaf?[accId]:DB.accounts.filter(x=>isLeaf(x.id)&&descendantOf(x.id,accId)).map(x=>x.id);
  const nat=TYPE_INFO[acctById(accId).type].nature;let b=0;
  DB.entries.forEach(e=>{if(e.date>=before)return;e.lines.forEach(l=>{if(ids.includes(l.accountId))b+=(nat==='debit'?((+l.debit||0)-(+l.credit||0)):((+l.credit||0)-(+l.debit||0)));});});
  return b;
}

}

/* ============ قائمة المركز المالي ============ */
function renderBalance(){
  const net=sumType('revenue',repFrom,repTo)-sumType('expense',repFrom,repTo);
  const sideRows=(type)=>typeGroups(type).map(g=>hierRows(g.id)).join('');
  const assets=sumType('asset',repFrom,repTo);
  const liab=sumType('liability',repFrom,repTo);const eq=sumType('equity',repFrom,repTo);
  const totalRightSide=liab+eq+net;
  const diff=Math.round((assets-totalRightSide)*100)/100;
  return `<div class="card">
    <div class="filter-bar">${repDateBar()}</div>
    <div class="toolbar"><div class="spacer"></div><button class="btn ghost sm" onclick="expandRep(true)">⊞ توسيع الكل</button><button class="btn ghost sm" onclick="expandRep(false)">⊟ طي الكل</button><button class="btn ghost sm" onclick="exportSheet('balance')">📅 تصدير</button><button class="btn ghost sm" onclick="printPage()">🖨️ طباعة</button></div>
    <div class="rep-head"><h3>قائمة المركز المالي</h3><p>${esc(DB.org)} · ${repRangeLabel()}</p></div>
    <div class="grid2">
      <div class="tbl-wrap"><table><thead><tr><th>الأصول</th><th>المبلغ</th></tr></thead><tbody>${sideRows('asset')||''}</tbody><tfoot><tr><td>إجمالي الأصول</td><td class="num">${fmt(assets)}</td></tr></tfoot></table></div>
      <div class="tbl-wrap"><table><thead><tr><th>الخصوم وحقوق الملكية</th><th>المبلغ</th></tr></thead><tbody>
        ${sideRows('liability')||''}
        ${sideRows('equity')||''}
        <tr style="background:rgba(212,175,55,.12);font-weight:700"><td>${net>=0?'صافي أرباح الفترة':'صافي خسائر الفترة'}</td><td class="num">${fmt(net)}</td></tr>
      </tbody><tfoot><tr><td>إجمالي الخصوم وحقوق الملكية</td><td class="num">${fmt(totalRightSide)}</td></tr></tfoot></table></div>
    </div>
    <div style="margin-top:16px;text-align:center;padding:12px;border-radius:12px;background:${diff===0?'rgba(22,163,74,.1)':'rgba(220,38,38,.1)'}">
      ${diff===0?'<span class="diff-ok">✓ الميزانية متوازنة (الأصول = الخصوم + حقوق الملكية)</span>':'<span class="diff-bad">فرق الميزانية: '+fmt(Math.abs(diff))+'</span>'}
    </div>
  </div>`;
}

function saveSettings(){DB.org=document.getElementById('setOrg').value.trim()||'شركتي';DB.currency=document.getElementById('setCur').value.trim()||'ج.م';save();document.getElementById('orgName').textContent=DB.org;toast('تم الحفظ','ok');}
function saveVoucherDefaults(){DB.defRcptAcc=document.getElementById('setRcpt').value;DB.defPayAcc=document.getElementById('setPay').value;save();toast('تم حفظ إعدادات السندات','ok');}
function backupJSON(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='erp_backup_'+today()+'.json';a.click();URL.revokeObjectURL(u);}
function restoreJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.accounts)throw 0;DB=d;fixOrphans();save();document.getElementById('orgName').textContent=DB.org;render();toast('تم الاسترداد','ok');}catch(e){toast('ملف غير صالح','err');}};r.readAsText(f);}
function resetAll(){if(!confirm('سيتم حذف بيانات الشركة الحالية وإعادة الشجرة الافتراضية. متأكد؟'))return;const id=activeCompanyId();if(id)localStorage.removeItem(LOCAL_PREFIX+id);localStorage.removeItem(SKEY);seed();const c=getCompanies().find(x=>x.id===id);if(c&&c.name)DB.org=c.name;save();render();toast('تم تصفير الشركة الحالية','ok');}
function printPage(){const pg=document.querySelector('#content');document.querySelectorAll('.page').forEach(p=>p.classList.remove('printing'));window.print();}

/* ============ النسخ الاحتياطي التلقائي اليومي ============ */
const AB_DATE_KEY='erp_autobackup_date';
let _idb=null;
function idb(){
  return new Promise((res,rej)=>{
    if(_idb)return res(_idb);
    const r=indexedDB.open('erp_backup_db',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('h');};
    r.onsuccess=()=>{_idb=r.result;res(_idb);};
    r.onerror=()=>rej(r.error);
  });
}
function idbPut(key,val){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('h','readwrite');t.objectStore('h').put(val,key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function idbGet(key){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('h','readonly');const g=t.objectStore('h').get(key);g.onsuccess=()=>res(g.result);g.onerror=()=>rej(g.error);}));}
function idbDel(key){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('h','readwrite');t.objectStore('h').delete(key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
async function verifyPerm(handle,write){
  const opts={mode:write?'readwrite':'read'};
  if((await handle.queryPermission(opts))==='granted')return true;
  if((await handle.requestPermission(opts))==='granted')return true;
  return false;
}
function fsaSupported(){return 'showSaveFilePicker' in window;}
async function setupAutoBackup(){
  if(!fsaSupported()){toast('المتصفح لا يدعم هذه الميزة — استخدم Chrome أو Edge','err');return;}
  try{
    const handle=await window.showSaveFilePicker({suggestedName:'erp_backup.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
    await idbPut('handle',handle);
    toast('تم تحديد الملف، جارٍ حفظ أول نسخة...','ok');
    await writeAutoBackup(true);
    renderAutoBackupStatus();
  }catch(e){if(e.name!=='AbortError')toast('تعذر تحديد الملف','err');}
}
async function writeAutoBackup(manual){
  try{
    const handle=await idbGet('handle');
    if(!handle){if(manual)toast('لم يتم تحديد ملف بعد','err');return false;}
    if(!(await verifyPerm(handle,true))){if(manual)toast('لم يُسمح بالوصول للملف','err');return false;}
    const w=await handle.createWritable();
    await w.write(JSON.stringify(DB,null,2));
    await w.close();
    localStorage.setItem(AB_DATE_KEY,today());
    if(manual)toast('تم حفظ النسخة الاحتياطية','ok');
    if(CUR==='settings')renderAutoBackupStatus();
    return true;
  }catch(e){if(manual)toast('فشل الحفظ: '+(e.message||e.name),'err');return false;}
}
async function removeAutoBackup(){
  await idbDel('handle');localStorage.removeItem(AB_DATE_KEY);
  toast('تم إيقاف النسخ التلقائي','ok');renderAutoBackupStatus();
}
async function renderAutoBackupStatus(){
  const box=document.getElementById('autoBkStatus');if(!box)return;
  if(!fsaSupported()){box.innerHTML='<div style="padding:12px;border-radius:10px;background:rgba(220,38,38,.08);color:var(--red);font-size:13px;font-weight:600">⚠️ هذه الميزة تعمل فقط على متصفح Chrome / Edge على الكمبيوتر.</div>';return;}
  let handle=null;try{handle=await idbGet('handle');}catch(e){}
  const onBtn=document.getElementById('bkNowBtn'),offBtn=document.getElementById('bkOffBtn');
  if(handle){
    const last=localStorage.getItem(AB_DATE_KEY)||'—';
    box.innerHTML=`<div style="padding:12px;border-radius:10px;background:rgba(22,163,74,.1);font-size:13px;font-weight:600">✅ النسخ التلقائي مفعّل<br><span style="color:var(--muted);font-weight:500">الملف: ${esc(handle.name)} · آخر نسخة: ${last}</span></div>`;
    if(onBtn)onBtn.style.display='';if(offBtn)offBtn.style.display='';
  }else{
    box.innerHTML='<div style="padding:12px;border-radius:10px;background:var(--border);font-size:13px;font-weight:600;color:var(--muted)">النسخ التلقائي غير مفعّل — اختر ملفاً لتفعيله.</div>';
    if(onBtn)onBtn.style.display='none';if(offBtn)offBtn.style.display='none';
  }
}
async function checkDailyBackup(){
  if(!fsaSupported())return;
  let handle=null;try{handle=await idbGet('handle');}catch(e){}
  if(!handle)return;
  if(localStorage.getItem(AB_DATE_KEY)===today())return; // تم النسخ اليوم
  const opts={mode:'readwrite'};
  if((await handle.queryPermission(opts))==='granted'){
    const ok=await writeAutoBackup(false);
    if(ok)toast('تم حفظ النسخة الاحتياطية اليومية 🔁','ok');
  }else{
    // تحتاج إذن المستخدم (سياسة المتصفح) — ننبّهه
    toast('نسخة اليوم جاهزة — افتح الإعدادات واضغط «نسخ الآن»','');
  }
}
/* ============ تصدير Excel ============ */
function aoa(sheetData){const ws=XLSX.utils.aoa_to_sheet(sheetData);ws['!cols']=sheetData[0].map((_,i)=>({wch:i===0?12:22}));return ws;}
function coaAOA(){
  const rows=[['الكود','اسم الحساب','المستوى','النوع','رصيد مدين','رصيد دائن']];
  const walk=a=>{const t=trialDrCr(a.id);rows.push([a.code,'   '.repeat(a.level-1)+a.name,a.level,TYPE_INFO[a.type].label,t.dr,t.cr]);children(a.id).forEach(walk);};
  DB.accounts.filter(a=>a.level===1).sort((a,b)=>a.code.localeCompare(b.code)).forEach(walk);
  return rows;
}
function journalAOA(){
  const rows=[['رقم القيد','التاريخ','البيان','كود الحساب','اسم الحساب','مدين','دائن','بيان السطر','مستند']];
  [...DB.entries].sort((a,b)=>a.date.localeCompare(b.date)||a.number-b.number).forEach(e=>{
    e.lines.forEach((l,i)=>{const a=acctById(l.accountId);rows.push([i===0?e.number:'',i===0?e.date:'',i===0?e.description:'',a?a.code:'',a?a.name:'',l.debit||0,l.credit||0,l.desc||'',i===0?entryAttList(e).map(x=>x.name).join(' | '):'']);});
  });
  return rows;
}
function trialAOA(){
  const rows=[['الكود','اسم الحساب','النوع','مدين','دائن']];let td=0,tc=0;
  leafAccounts().forEach(a=>{const b=accBalance(a.id);const dr=b.net>0?b.net:0,cr=b.net<0?-b.net:0;if(dr||cr){rows.push([a.code,a.name,TYPE_INFO[a.type].label,dr,cr]);td+=dr;tc+=cr;}});
  rows.push(['','الإجمالي','',td,tc]);return rows;
}
function hierAOA(accId,rows){const a=acctById(accId);rows.push(['   '.repeat(a.level-1)+a.name,naturalGross(accId)]);children(accId).forEach(c=>hierAOA(c.id,rows));}
function incomeAOA(){
  const rows=[['البيان','المبلغ']];
  rows.push(['الإيرادات','']);
  typeGroups('revenue').forEach(g=>hierAOA(g.id,rows));
  const tr=typeGroups('revenue').reduce((s,g)=>s+naturalGross(g.id),0);
  rows.push(['إجمالي الإيرادات',tr]);
  const {cogs,opex}=splitExpense();
  const tcogs=cogs.reduce((s,g)=>s+naturalGross(g.id),0);
  const topex=opex.reduce((s,g)=>s+naturalGross(g.id),0);
  rows.push(['(−) تكلفة البضاعة المباعة','']);
  cogs.forEach(g=>hierAOA(g.id,rows));
  rows.push(['إجمالي تكلفة البضاعة المباعة',tcogs]);
  rows.push(['مجمل الربح',tr-tcogs]);
  rows.push(['(−) المصروفات التشغيلية والأخرى','']);
  opex.forEach(g=>hierAOA(g.id,rows));
  rows.push(['إجمالي المصروفات التشغيلية',topex]);
  rows.push(['صافي الربح / (الخسارة)',tr-tcogs-topex]);return rows;
}
function balanceAOA(){
  const net=sumType('revenue')-sumType('expense');
  const rows=[['البيان','المبلغ']];
  rows.push(['الأصول','']);
  typeGroups('asset').forEach(g=>hierAOA(g.id,rows));
  rows.push(['إجمالي الأصول',sumType('asset')]);
  rows.push(['الخصوم وحقوق الملكية','']);
  typeGroups('liability').forEach(g=>hierAOA(g.id,rows));
  typeGroups('equity').forEach(g=>hierAOA(g.id,rows));
  rows.push(['صافي أرباح الفترة',net]);
  rows.push(['إجمالي الخصوم وحقوق الملكية',sumType('liability')+sumType('equity')+net]);return rows;
}
function ledgerAOA(accId){
  const a=acctById(accId);const nat=TYPE_INFO[a.type].nature;
  const rows=[['التاريخ','رقم القيد','البيان','مدين','دائن','الرصيد']];
  const r=collectRows(accId);let run=0;
  r.forEach(x=>{run+=(nat==='debit'?(x.debit-x.credit):(x.credit-x.debit));rows.push([x.date,x.num,x.desc,x.debit||0,x.credit||0,run]);});
  return rows;
}
function exportSheet(which){
  const wb=XLSX.utils.book_new();
  if(which==='coa')XLSX.utils.book_append_sheet(wb,aoa(coaAOA()),'شجرة الحسابات');
  else if(which==='journal')XLSX.utils.book_append_sheet(wb,aoa(journalAOA()),'القيود اليومية');
  else if(which==='trial')XLSX.utils.book_append_sheet(wb,aoa(trialAOA()),'ميزان المراجعة');
  else if(which==='income')XLSX.utils.book_append_sheet(wb,aoa(incomeAOA()),'قائمة الدخل');
  else if(which==='balance')XLSX.utils.book_append_sheet(wb,aoa(balanceAOA()),'المركز المالي');
  else if(which==='ledger')XLSX.utils.book_append_sheet(wb,aoa(ledgerAOA(ledgerAcc)),'دفتر الأستاذ');
  else if(which==='statement')XLSX.utils.book_append_sheet(wb,aoa(ledgerAOA(stAcc)),'كشف حساب');
  XLSX.writeFile(wb,'erp_'+which+'_'+today()+'.xlsx');toast('تم التصدير','ok');
}
function exportAllExcel(){
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,aoa(coaAOA()),'شجرة الحسابات');
  XLSX.utils.book_append_sheet(wb,aoa(journalAOA()),'القيود اليومية');
  XLSX.utils.book_append_sheet(wb,aoa(trialAOA()),'ميزان المراجعة');
  XLSX.utils.book_append_sheet(wb,aoa(incomeAOA()),'قائمة الدخل');
  XLSX.utils.book_append_sheet(wb,aoa(balanceAOA()),'المركز المالي');
  // دفتر الأستاذ المجمع لكل حساب له حركة
  const led=[['الحساب','التاريخ','رقم القيد','البيان','مدين','دائن','الرصيد']];
  leafAccounts().forEach(a=>{const r=collectRows(a.id);if(!r.length)return;const nat=TYPE_INFO[a.type].nature;let run=0;r.forEach(x=>{run+=(nat==='debit'?(x.debit-x.credit):(x.credit-x.debit));led.push([a.code+' '+a.name,x.date,x.num,x.desc,x.debit||0,x.credit||0,run]);});});
  XLSX.utils.book_append_sheet(wb,aoa(led),'دفتر الأستاذ');
  XLSX.writeFile(wb,'النظام_المحاسبي_كامل_'+today()+'.xlsx');
  toast('تم تصدير النظام كاملاً','ok');
}
/* ============ التهيئة ============ */
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('mousedown',e=>{if(!e.target.closest('.sel-wrap'))document.querySelectorAll('.sel-search').forEach(s=>s.classList.remove('open'));});
(async function init(){
  if(localStorage.getItem('erp_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeBtn').textContent='☀️';}
  if(!supaReady()){showConfigNeeded();return;}
  initSupa();
  try{const {data}=await window._supa.auth.getSession();_supaUser=(data&&data.session)?data.session.user:null;}catch(e){_supaUser=null;}
  if(!_supaUser){await showAuthGate({canRegister:true,title:'الدخول للنظام'});}
  await loadProfile();
  const cu=currentUser();
  if(cu&&cu.role==='company')document.body.classList.add('role-company');
  await cloudInitPull();
  if(URL_C&&getCompanies().some(c=>c.id===URL_C))setActiveCompany(URL_C);
  let list=getCompanies(),act=activeCompanyId();
  if(!list.some(c=>c.id===act)){act=list[0]?list[0].id:act;if(act)setActiveCompany(act);}
  load();
  renderCompanySwitch();
  document.getElementById('orgName').textContent=DB.org;
  go('dashboard');
  migrateAttachments().catch(()=>{});
  setTimeout(()=>{try{checkDailyBackup();}catch(e){}},1200);
  setInterval(periodicPull,25000);
})();
</script>
